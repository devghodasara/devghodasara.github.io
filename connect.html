    <div class="connect-divider">or send a message</div>

    <!-- Contact form -->
    <div class="contact-form-wrap">
      <p class="form-title">// contact.send()</p>
      <form id="contact-form" onsubmit="submitToGoogleForm(event, this)" novalidate>

        <div class="form-row">
          <div class="form-field">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" placeholder="Jane" autocomplete="given-name" required>
          </div>
          <div class="form-field">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" placeholder="Doe" autocomplete="family-name" required>
          </div>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label for="phone_number">Phone <span style="color:var(--text-faint); font-weight:400;">(optional)</span></label>
          <input type="tel" id="phone_number" name="phone_number" placeholder="5551234567" autocomplete="mobile" pattern="[0-9]{10}">
        </div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="What's on your mind?" required>
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Tell me more..." oninput="autoResize(this)" required></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="form-btn-clear" onclick="clearForm()">Clear</button>
          <button type="submit" class="form-btn-submit">Send Message</button>
        </div>

        <div id="form-status" role="status" aria-live="polite"></div>

      </form>
    </div>
  </main>

  <script src="script.js"></script>
