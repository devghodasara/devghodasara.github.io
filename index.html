<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dev Ghodasara — Software Developer & problem solver. Dev by name, developer by nature.">
  <link rel="stylesheet" href="styles.css">
  <title>Dev Ghodasara</title>
</head>
<body>

  <!-- Floating code symbol canvas -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- NAV -->
  <header>
    <a href="https://www.ghodasara.dev" id="website-name" aria-label="Dev Ghodasara home">
      <h1>
        <span class="tag-open">&lt;</span><span class="name-dev">Dev</span><span class="tag-close">/&gt;</span><span class="name-last">Ghodasara</span>
      </h1>
    </a>

    <button class="toggle-menu" onclick="displayMenu()" aria-label="Toggle menu" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <nav class="sections" id="nav-menu">
      <ul>
        <li><a href="https://www.ghodasara.dev" aria-current="page">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="connect.html">Connect</a></li>
        <li><a href="resume.html">Resume</a></li>
      </ul>
    </nav>

    <div class="theme-toggle">
      <input type="checkbox" id="themeSwitch" aria-label="Toggle light mode">
      <label for="themeSwitch" class="toggle-label" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </label>
    </div>
  </header>

  <!-- HERO -->
  <main class="hero-page">

    <div class="hero-top">
      <p class="hero-greeting" id="hero-greeting">Hello, I'm</p>

      <!-- Hero name: brackets animate in separately to wrap "Dev" -->
      <h2 class="hero-name" id="hero-name">
        <span id="tag-left"  class="tag-bracket">&lt;</span><span id="hero-dev-text">Dev</span><span id="tag-right" class="tag-slash">/&gt;</span>
      </h2>

      <p class="hero-tagline" id="hero-tagline">Dev by name. Developer by nature.</p>
      <div class="hero-ctas" id="hero-ctas">
        <a href="projects.html" class="btn-primary">View Projects</a>
        <a href="connect.html" class="btn-secondary">Get in Touch</a>
      </div>
    </div>

    <!-- Terminal code window -->
    <div class="code-window" id="code-window" role="img" aria-label="Code snippet introducing Dev Ghodasara">
      <div class="cw-titlebar">
        <div class="cw-dots">
          <span class="cw-dot red"></span>
          <span class="cw-dot yellow"></span>
          <span class="cw-dot green"></span>
        </div>
        <span class="cw-filename">dev.js</span>
      </div>
      <div class="cw-body">
        <pre id="code-output" aria-label="Typing animation"></pre>
        <span class="cw-cursor" id="cw-cursor" aria-hidden="true"></span>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
